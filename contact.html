<div class="contact-form">

<h2>Send Enquiry</h2>

<form 
    name="contact"
    method="POST"
    data-netlify="true"
    action="success.html"
>

<input type="hidden" name="form-name" value="contact">

<p style="display:none;">
    <label>
        Don't fill this out:
        <input name="bot-field">
    </label>
</p>

<input 
    type="text" 
    name="name" 
    placeholder="Your Name" 
    required
>

<input 
    type="email" 
    name="email" 
    placeholder="Your Email" 
    required
>

<input 
    type="text" 
    name="company" 
    placeholder="Company Name"
>

<input 
    type="tel" 
    name="phone" 
    placeholder="Phone Number" 
    required
>

<textarea 
    name="message" 
    placeholder="Your Message" 
    rows="6" 
    required
></textarea>

<button type="submit">
    Submit Enquiry
</button>

</form>

</div>
